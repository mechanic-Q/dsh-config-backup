# --- web providers: AnySearch（2026-10-20 起接管搜索+抓取）---
# dsh-web replaces the WHOLE config row, so both keys must be listed together.
# 切回官方只改这两行为 deepseek-search-api / deepseek-fetch-api，
# 或临时 export DSH_WEB_SEARCH_PROVIDER=deepseek-search-api 覆盖。
- id: web
  config:
    searchProvider: anysearch
    fetchProvider: anysearch

# --- 单次搜索的结果条数：内置 tool-web 默认只留 8 条，provider 又默认只要 10 条，
# 所以这两处必须一起调（任一处的较小值生效）。searchTimeoutMs 因整行替换必须带上。---
- id: tool-web
  config:
    fetch: true
    searchTimeoutMs: 60000
    searchMaxResults: 15
- id: web-deepseek-api
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    count: 15

# --- AnySearch：免 key 匿名档 1000 次/天。填了 ANYSEARCH_API_KEY 才走注册额度；
# 注意无效 key 不降级（直接 401），不确定就别填，留空即匿名。---
- id: web-search-anysearch
  name: "@anysearch/anysearch-dsh"
  config:
    apiKeyEnv: ANYSEARCH_API_KEY
    # 默认 12000 字符，会把长文档（pypi 43KB）截掉三分之二。抬到 60000 覆盖绝大多数文档页；
    # 真正的硬上限在 tool-web 的 fetchMaxOutputChars（默认 200000），不会冲突。
    maxRenderedContentChars: 60000

# --- dsh-free-search：27 引擎 / 13 平台 / 41 垂直源，不改 searchProvider（运行时只在
# 未设或仍是 deepseek-official 时接管；这里已显式 anysearch，它只 warn 不动手）。---
- id: web-search-free
  name: dsh-free-search
  config:
    provider: bing
    bingMarket: zh-CN
    # 本机 SearXNG（Docker，实际端口 28888 不是 8888）；上游 brave/ddg/google 常被墙或 CAPTCHA，
    # 靠 bing 兜住。实例不可达时插件自动跳过，不影响主链路。
    searxngInstances:
      - "http://127.0.0.1:28888"
    # 2026-10-21 实测后收窄回退链。默认链有 25 个引擎，其中十几个是 fail[auth]（无 key），
    # 每次搜索要先烧一遍才轮到能用的。这里只留**实测能出结果的 7 个**：
    #   exa/tavily/keenable/firecrawl/parallel —— 免 key 匿名档（free_search_test 全绿）
    #   bing —— 稳定兜底；anysearch —— 中文最强
    # 砍掉：ddg/ddg-lite（bot-wall）、perplexity/serpbase/serply/you/baidu/kimi/aliyun/doubao/
    #       tinyfish/jina/zhihu_*（全部 fail[auth]）、deepseek-tools/official（quota）、searxng（单独跑 0 命中）
    fallbackOrder:
      - anysearch
      - bing
      - exa
      - tavily
      - keenable
      - firecrawl
      - parallel
    # 只留真正需要的引擎；其余显式禁用，避免任何路径再去试它们。
    disabledEngines:
      - ddg
      - ddg-lite
      - searxng
      - perplexity
      - serpbase
      - serply
      - you
      - baidu
      - kimi
      - aliyun
      - doubao
      - tinyfish
      - jina
      - zhihu_global
      - zhihu_site
      - deepseek-official
      - deepseek-tools

# --- deep-search 编排层：四档开关见 ~/.dsh/procedures/检索-deep-search编排层.md ---
# alwaysSearch:false → 不再默认接管所有联网问题；promptInjection:true → 保留提示让我知道它存在。
- id: deep-search
  name: dsh-deep-search
  config:
    alwaysSearch: false
    promptInjection: true
    maxRounds: 5
    budgetChars: 8000
    # 2026-10-21 实测：18 个免 key target 只有 7 个真出结果。
    # 砍掉 5 个必失败（reddit 403 / v2ex 404 / bilibili malformed / weibo 登录墙 / x 无访问）
    # 与 6 个「成功但 0 命中」的（ddg / ddg-lite / searxng / mojeek / firecrawl-keyless / stackoverflow）。
    # 2026-10-21 追加 tavily，并定为链首：引擎是链式的，第一个出结果的答完整轮；
    # bing 对英文技术词几乎总有「噪音命中」（查 nuke compositing 返回核爆模拟器），
    # 放链首会让 tavily 永不触发。tavily 命中率 4/6 vs bing 0/8，故 tavily 先、
    # bing 只作 tavily 失败/0 命中时的兜底。成本 1 credit/查询（1000/月 ≈ 100 次深检索）。
    enabledEngines:
      - tavily
      - bing
    enabledPlatforms:
      - github
      - hackernews
      - npm
      - huggingface
      - modelscope
      - wikipedia
    searxngInstances:
      - "http://127.0.0.1:28888"
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access

