- id: remote-web-ui
  name: '@linxin666/dsh-remote-web-ui'
  disabled: false
  config:
    lanBind: true
    autoTunnel: false
    relay: false
    tokenTtlMs: 1800000
    maxDevices: 8
- id: dsh-ops-ptc
  disabled: false

# --- pin DeepSeek Search / Fetch API as the web providers ---
# dsh-web replaces the WHOLE config row, so both keys must be listed together.
- id: web
  config:
    searchProvider: deepseek-search-api
    fetchProvider: deepseek-fetch-api

# --- 单次搜索的结果条数：内置 tool-web 默认只留 8 条，provider 又默认只要 10 条，
# 所以这两处必须一起调（任一处的较小值生效）。searchTimeoutMs 因整行替换必须带上。---
- id: tool-web
  config:
    fetch: true
    searchTimeoutMs: 60000
    searchMaxResults: 15
- id: web-deepseek-api
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    count: 15
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access

# ===================== 插件收敛 2026-10-18 =====================
# 决策依据: 优先级 C(不静默出错) > B(一域一主人) > A(省 token)。
# 回滚: 删掉本段即可；改前快照 20261018-213318-481d。
# 生效: 需重启 DSH（desktop 应用）。

# 1) 会话标题: codex-ui 用 prototype 改写 sessionTitle.register 静默屏蔽官方标题，
#    关掉它的标题行 → 标题回归 core 官方 LLM，不再有静默接管。

# 2) 浏览器: 只关 agent 侧 34 个 dsh_browser_* 工具行（6.3K tok，4 天调 1 次）。
#    browser seam 与侧栏浏览器仍由 browser/browser-electron 两行提供，人工照常可用。
- id: tool-browser
  disabled: true

# 3) 搜索: profile 已把 searchProvider 钉死 deepseek-search-api，
#    free-search 只打警告、不干活，却注册 10 工具并注入 7.7KB 宣传段。

# 4) 编排: ralph / PUA 已被 agent-team + task-board 覆盖（4 天 0 次）。
- id: optional-ralph
  disabled: true

# 5) 哑弹: browser-skill（bsk CLI 缺失）、modlens（modlens CLI 缺失）。
- id: modlens
  disabled: true

# 6) univer: 25 个工具 4 天 0 次，占 216MB + 3.2K tok。
#    默认关；要用时把本行改 false（或删掉这三行）再重启。
- id: univer
  disabled: true
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: ptc
- id: dsh-context
  disabled: false
- id: agency-agents-remote
  disabled: true
- id: agency-agents
  disabled: true
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
